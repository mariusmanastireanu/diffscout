name: Release
# Run from the Actions tab: bumps the version in manifest.json and package.json, commits, tags,
# and publishes a GitHub Release with the extension zip.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Bump version
        id: version
        run: |
          VERSION=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const [maj, min, pat] = m.version.split(".").map(Number);
            const next = { major: [maj + 1, 0, 0], minor: [maj, min + 1, 0], patch: [maj, min, pat + 1] }[process.argv[1]].join(".");
            for (const f of ["manifest.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = next;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            console.log(next);
          ' "${{ inputs.bump }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run package
      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"
          gh release create "$TAG" dist/*.zip --generate-notes
